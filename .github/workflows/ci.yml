name: Validate library
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm build
        env:
          VITE_BASE_PATH: /subpath-test/
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:pages
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PAGES_BASE_PATH: /subpath-test/
      - run: pnpm test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failures
          path: test-results/
